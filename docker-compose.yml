services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ~/.gitconfig:/root/.gitconfig:ro
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    tty: true  # ウォッチャープロセスのために必要

volumes:
  mysql_data:
