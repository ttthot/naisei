services:
  db:
    image: mysql:8.4
    ports:
      - '3306:3306' # ホスト側:コンテナ側のポート番号
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      # 開発用のDockerfileを指定
      dockerfile: Dockerfile.dev
      # todo 一旦キャッシュを有効化する、異常発生時はnoキャッシュで行うこと
      cache_from:
        - naisei-web:dev
    image: naisei-web:dev
    # デバック用　３０００番ポートなら直接railsにアクセスできる
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - ~/.gitconfig:/root/.gitconfig:ro
    # メモリ制限（Docker Desktop: 5-6GB利用可能、余裕を持った設定）
    mem_limit: 3g
    # メモリスワップを4GBに設定
    memswap_limit: 4g
    # CPU制限（Docker Desktop: 4CPU利用可能）
    cpus: '3.0'
    # OOM Killerを有効に戻す（メモリ制限内で動作させる）
    # oom_kill_disable: true
    environment:
      #　開発用の環境変数を指定
      RAILS_ENV: development
      NODE_ENV: development
      # Dockerfile側の本番用設定を上書きし、全Gemをインストール
      BUNDLE_WITHOUT: ''
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: password
      #初期ヒープサイズを制限してメモリ使用量を抑制
      RUBY_GC_HEAP_INIT_SLOTS: 40000
      # ヒープが足りなくなった時の成長率を1.1倍に抑制
      RUBY_GC_HEAP_GROWTH_FACTOR: 1.1
      # 一度に追加できるヒープスロットの最大数を制限
      RUBY_GC_HEAP_GROWTH_MAX_SLOTS: 5000
    depends_on:
      db:
        condition: service_healthy
        restart: true
    # DevContainer用の安定起動コマンド（段階的に処理）
    command: |
      bash -c "
        echo '=== DevContainer 起動開始 ==='
        echo '1. 環境確認中...'
        ls -la Procfile.dev
        ls -la bin/dev
        echo '2. データベース接続待機中...'
        until nc -z db 3306; do
          echo 'データベース接続待機中...'
          sleep 2
        done
        echo '3. Gemの確認...'
        bundle check || bundle install
        echo '4. データベースの準備...'
        rails db:prepare || echo 'DB準備スキップ'
        echo '5. サーバー起動中...'
        exec bin/dev
      "
    restart: unless-stopped
    tty: true # ウォッチャープロセスのために必要

  # Nginxサービスを追加
  nginx:
    # イメージはローカルファイルを指定しないに変更、公式イメージを使用

    image: nginx:stable-alpine
    # build:
    #   context: ./nginx
    # HTTP通信用の標準ポートである80番で通信をローカルで受けて、このコンテナの80番ポートに転送、nginx.confへ
    ports:
      - '80:80' # デフォルトのHTTPポート
    volumes:
      # コロンのホスト側のパス : コンテナ側のパス [:オプション]
      - ./nginx/nginx.conf.local:/etc/nginx/conf.d/default.conf
      - ./public:/app/public
    # Railsアプリが起動してから、Nginxが起動する順序を保証
    # proxy_pass http://web:3000の設定がエラーにならないためにはRailsが起動している必要がある
    depends_on:
      - web

volumes:
  mysql_data:
