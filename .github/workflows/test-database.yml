# .github/workflows/test-database.yml
name: Test Database Connection
on: push
jobs:
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: MySQLが起動するまで待機
        run: |
          echo "起動を待っています..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: 接続テスト
        run: |
          echo "MySQLに接続を試みます..."
          mysql -h 127.0.0.1 -uroot -ppassword -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -uroot -ppassword -e "SELECT VERSION();"
          echo "接続成功！"
