name: Test Ruby Setup
# on: push

jobs:
  test-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rubyバージョンファイルの確認
        run: |
          if [ -f .ruby-version ]; then
            echo "found: $(cat .ruby-version)"
          else
            echo ".ruby-version not found!"
            echo "3.2.0" > .ruby-version
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Ruby環境の確認
        run: |
          echo "Ruby バージョン"
          ruby -v
          echo "Bundler バージョン"
          bundle -v
          echo "Gem インストール場所"
          bundle config get path
