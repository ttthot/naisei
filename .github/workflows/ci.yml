name: Rails CI # ワークフローの名前

# 並列実行ではなく 直列実行　連続pushを防止
concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, feature/advance-ci-action]
  pull_request:
    branches: [main]

jobs:
  test: # ジョブ名
    runs-on: ubuntu-latest

    env: # このジョブ内のすべてのステップで有効
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_HOST: 127.0.0.1
      DB_NAME_TEST: myapp_test
      RAILS_ENV: test

    services: # ジョブ開始時にbgで動作し続ける、stepsはその後に順次実行
      mysql: #
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password # rootパスワード
          MYSQL_DATABASE: myapp_test # 初期作成するデータベース名
        ports:
          - 3306:3306 # MySQLポートをマッピング
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent" 
          --health-interval=10s           
          --health-timeout=5s              
          --health-retries=5

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4 # リポジトリのコードを取得

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1 # Ruby環境をセットアップ
        with:
          ruby-version: .ruby-version # .ruby-versionファイルの指定バージョンを使用
          bundler-cache: true # bundle install結果をキャッシュ

      - name: データベース設定の確認
        run: | # YAML の | は「この下の複数行を"改行つきの1つの文字列"にする
          echo "database.yml の確認"  # ログ表示
          if [ -f config/database.yml ]; then  # ローカルにdatabase.ymlが存在するか確認
            echo "test環境の設定:"
            grep -A 10 "^test:" config/database.yml || echo "test設定が見つかりません"  # test設定部分を表示
          else
            echo "config/database.yml が見つかりません"  
          fi

      - name: データベースをセットアップ
        run: |
          echo "データベースを作成中..."
          bin/rails db:create || echo "既に存在するか、エラーが発生しました" # DB作成、失敗時はメッセージ表示

          echo "スキーマをロード中..."
          bin/rails db:schema:load || bin/rails db:migrate # スキーマロード、失敗時はマイグレーション実行
          # db:prepareは db:create db:schema:load を実行
          # bin/rails db:prepare
          echo "最初のテストを実行..."
          # まず1つのテストファイルだけ実行
          if [ -d spec ]; then  # RSpecディレクトリがある場合
            bundle exec rspec --fail-fast || echo "テスト失敗（続行）"  # spce/フォルダ以下全てのテスト実行 --fail-fast オプションは最初の失敗でテストを止める
          else  # specがない場合はMinitestを想定
            echo "specディレクトリが見つかりません"
            bundle exec rails test || echo "テスト失敗（続行）"
          fi

  build-and-push: #ジョブ名
    needs: test # test ジョブが成功した後にのみ実行
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # pull Rでは作動しない

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1 # 東京リージョン

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # コマンドでログインしていたのものの代替

      - name: Guard RAILS_MASTER_KEY
        run: |
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "ERROR: RAILS_MASTER_KEY is not set." >&2
            exit 1
          fi
      - name: Print image URIs (debug)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          echo "$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$TAG"
          echo "$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_NGINX }}:$TAG"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }} #gitコミットのハッシュ値をタグとして使用
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail  # エラー時に即座に終了
          : "${TAG:?TAG is empty}"
          : "${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is empty}"

          # webを先にビルド・プッシュ 内部処理はrailsのファイルをnginxがコピーしているため先にpushが必要
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build web
          docker compose -f docker-compose.yml -f docker-compose.prod.yml push web

          # その後nginx
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build nginx
          docker compose -f docker-compose.yml -f docker-compose.prod.yml push  nginx

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest-arm64
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR # outputs.registry を image で使うため（push はしない）
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve task definition ARN from service
        id: svc
        run: |
          ARN=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.svc.outputs.arn }}" \
            --query taskDefinition > task-definition.json

      - name: Compose images (short)
        id: img
        run: |
          set -eu
          REG="${{ steps.login-ecr.outputs.registry }}"
          RAILS_REPO="${{ secrets.ECR_REPOSITORY }}"
          NGINX_REPO="${{ secrets.ECR_REPOSITORY_NGINX }}"
          [ -n "$REG" ] && [ -n "$RAILS_REPO" ] && [ -n "$NGINX_REPO" ] || { echo "ECR 設定が空"; exit 1; }
          echo "rails=$REG/$RAILS_REPO:${{ github.sha }}"  >> "$GITHUB_OUTPUT"
          echo "nginx=$REG/$NGINX_REPO:${{ github.sha }}"  >> "$GITHUB_OUTPUT"

      # rails コンテナを SHA に置換
      - name: Render taskdef (rails)
        id: taskdef-rails
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: rails
          image: ${{ steps.img.outputs.rails }}

      # nginx コンテナも同じ SHA に置換
      - name: Render taskdef (nginx)
        id: taskdef-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef-rails.outputs.task-definition }}
          container-name: nginx
          image: ${{ steps.img.outputs.nginx }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-nginx.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
